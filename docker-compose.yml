version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: markdown-editor-mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb:/data/db
    environment:
      # No authentication for local development
      MONGO_INITDB_DATABASE: markdown_editor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
